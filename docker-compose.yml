services:
  postgres:
    image: postgres:16-alpine
    container_name: weg-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - weg-network

  redis:
    image: redis:7-alpine
    container_name: weg-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - weg-network

  minio:
    image: minio/minio:latest
    container_name: weg-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - weg-network

  minio-init:
    image: minio/mc:latest
    container_name: weg-minio-init
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        echo "Configurando conexão com o MinIO..."

        mc alias set \
          local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"

        mc ready local

        echo "Criando buckets..."

        mc mb --ignore-existing \
          "local/$${MINIO_PUBLIC_BUCKET}"

        mc mb --ignore-existing \
          "local/$${MINIO_PRIVATE_BUCKET}"

        echo "Configurando políticas de acesso..."

        mc anonymous set download \
          "local/$${MINIO_PUBLIC_BUCKET}"

        mc anonymous set none \
          "local/$${MINIO_PRIVATE_BUCKET}"

        echo "Criando configuração de CORS..."

        cat > /tmp/cors.xml <<EOF
        <CORSConfiguration>
          <CORSRule>
            <AllowedOrigin>$${FRONTEND_ORIGIN}</AllowedOrigin>

            <AllowedMethod>GET</AllowedMethod>
            <AllowedMethod>POST</AllowedMethod>
            <AllowedMethod>PUT</AllowedMethod>
            <AllowedMethod>HEAD</AllowedMethod>

            <AllowedHeader>*</AllowedHeader>

            <ExposeHeader>ETag</ExposeHeader>

            <MaxAgeSeconds>3600</MaxAgeSeconds>
          </CORSRule>
        </CORSConfiguration>
        EOF

        echo "Aplicando CORS aos buckets..."

        mc cors set \
          "local/$${MINIO_PUBLIC_BUCKET}" \
          /tmp/cors.xml

        mc cors set \
          "local/$${MINIO_PRIVATE_BUCKET}" \
          /tmp/cors.xml

        echo "MinIO configurado com sucesso."

    networks:
      - weg-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  weg-network:
    driver: bridge