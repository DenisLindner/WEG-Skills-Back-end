spring.application.name=weg_skills

server.servlet.context-path=/api
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:weg_skills}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95

springdoc.swagger-ui.path=/docs

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

logging.level.root=INFO
logging.level.com.weg.weg_skills=INFO

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin123}

minio.buckets.public-assets=${MINIO_PUBLIC_BUCKET:course-public-assets}
minio.buckets.private-videos=${MINIO_PRIVATE_BUCKET:course-private-videos}

minio.upload-expiration=15m
minio.playback-expiration=5m

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=1h
security.jwt.issuer=weg-skills-api

cors.config.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.repositories.enabled=false

spring.cache.type=redis
spring.cache.cache-names=topCourses
spring.cache.redis.enable-statistics=true
